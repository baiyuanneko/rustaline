<!DOCTYPE html>
<!-- bynrust26 静态文件服务示例页（原生 HTML/JS，无框架无构建步骤）。
     演示从浏览器调用后端 API：/health 与未鉴权访问 /api/v1/users 的 401 行为。
     生产环境可将本目录替换为任意前端构建产物。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bynrust26 示例页</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .card h2 { font-size: 1rem; margin-top: 0; }
    pre { background: #f5f5f5; border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 0.85rem; }
    button { padding: 8px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .ok { color: #16a34a; }
    .err { color: #dc2626; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>bynrust26 静态示例页</h1>
  <p>本页面由 axum 的 <code>ServeDir</code> 从 <code>/static</code> 提供服务。</p>

  <div class="card">
    <h2>服务健康状态（GET /health）</h2>
    <pre id="health-result">加载中…</pre>
  </div>

  <div class="card">
    <h2>鉴权演示（GET /api/v1/users，不带 token）</h2>
    <button id="call-users">调用受保护接口</button>
    <pre id="users-result">点击按钮调用</pre>
  </div>

  <div class="card">
    <h2>API 文档</h2>
    <p><a href="/swagger-ui/" target="_blank">打开 Swagger UI →</a></p>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
