<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>bynrust26 脚手架示例</title>
  <link rel="stylesheet" href="/vendor/mdui/mdui.css">
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      color: rgb(var(--mdui-color-on-background));
      background: rgb(var(--mdui-color-background));
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui,
        -apple-system, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.7;
    }
    .page-wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
    .back { margin: 8px 0 24px; }
    .back a { color: rgb(var(--mdui-color-primary)); text-decoration: none; }
    .card { margin: 16px 0; }
    .card__body { padding: 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; color: rgb(var(--mdui-color-on-background)); }
    .subtitle { font-size: 14px; color: rgb(var(--mdui-color-on-surface-variant)); }
    pre {
      background: rgb(var(--mdui-color-surface-container));
      border: 1px solid rgb(var(--mdui-color-outline-variant));
      border-radius: var(--mdui-shape-corner-medium, 12px);
      padding: 12px;
      overflow-x: auto;
      font-size: 13px;
      color: rgb(var(--mdui-color-on-surface));
    }
    .ok { color: rgb(var(--mdui-color-primary)); }
    .err { color: rgb(var(--mdui-color-error)); }
    .api-link { color: rgb(var(--mdui-color-primary)); text-decoration: none; }
  </style>
  <script defer src="/vendor/mdui/mdui.global.js"></script>
  <script defer src="/theme.js"></script>
</head>
<body>
  <mdui-layout full-height>
    <mdui-top-app-bar variant="small">
      <mdui-top-app-bar-title>脚手架示例</mdui-top-app-bar-title>
    </mdui-top-app-bar>

    <mdui-layout-main>
      <div class="page-wrap">
        <p class="back"><a href="/">← 返回 rustaline 评论演示</a></p>

        <h1>bynrust26 脚手架示例</h1>
        <p class="subtitle">本页面由 axum 的 <code>ServeDir</code> 从根路径提供服务（<code>ServeDir</code> 兜底挂载 static/ 目录）。</p>

        <mdui-card class="card">
          <div class="card__body">
            <h2 style="margin: 0 0 8px; font-size: 1rem;">服务健康状态（GET /health）</h2>
            <pre id="health-result">加载中…</pre>
          </div>
        </mdui-card>

        <mdui-card class="card">
          <div class="card__body">
            <h2 style="margin: 0 0 8px; font-size: 1rem;">鉴权演示（GET /api/v1/users，不带 token）</h2>
            <mdui-button id="call-users" variant="filled">调用受保护接口</mdui-button>
            <pre id="users-result">点击按钮调用</pre>
          </div>
        </mdui-card>

        <mdui-card class="card">
          <div class="card__body">
            <h2 style="margin: 0 0 8px; font-size: 1rem;">API 文档</h2>
            <p style="margin: 0;"><a class="api-link" href="/swagger-ui/" target="_blank">打开 Swagger UI →</a></p>
          </div>
        </mdui-card>
      </div>
    </mdui-layout-main>
  </mdui-layout>

  <script src="/app.js"></script>
</body>
</html>
