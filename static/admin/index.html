<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>rustaline · 管理面板</title>
    <link rel="stylesheet" href="./admin.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b45309'/%3E%3Cpath d='M9 11h14M9 16h10M9 21h7' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body data-theme="auto">
    <!-- 顶栏（移动端含汉堡按钮） -->
    <header class="topbar">
      <button class="topbar__menu" id="menu-toggle" type="button" aria-label="切换导航">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <a class="topbar__brand" href="#/dashboard">
        <span class="topbar__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22">
            <rect width="32" height="32" rx="7" fill="currentColor" />
            <path d="M9 11h14M9 16h10M9 21h7" stroke="#fff" stroke-width="2" stroke-linecap="round" />
          </svg>
        </span>
        <span class="topbar__title">rustaline</span>
        <span class="topbar__sep" aria-hidden="true">/</span>
        <span class="topbar__subtitle">管理面板</span>
      </a>
      <div class="topbar__spacer"></div>
      <div class="topbar__user" id="topbar-user" hidden>
        <span class="topbar__username" id="topbar-username"></span>
        <button class="btn btn--ghost btn--sm" id="logout-btn" type="button">登出</button>
      </div>
    </header>

    <div class="shell">
      <!-- 侧边导航 -->
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <nav class="nav">
          <a class="nav__item" href="#/dashboard" data-route="dashboard">
            <span class="nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path d="M4 13h6V4H4v9zm10 7h6V4h-6v16zM4 20h6v-4H4v4z" fill="currentColor" />
              </svg>
            </span>
            <span class="nav__label">仪表盘</span>
          </a>
          <a class="nav__item" href="#/comments" data-route="comments">
            <span class="nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path d="M21 11.5a8.38 8.38 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-4.5A8.38 8.38 0 0 1 3 11.5a8.5 8.5 0 0 1 17 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="nav__label">评论管理</span>
            <span class="nav__badge" id="pending-badge" hidden></span>
          </a>
          <a class="nav__item" href="#/import" data-route="import">
            <span class="nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="nav__label">Valine 导入</span>
          </a>
          <a class="nav__item" href="#/settings" data-route="settings">
            <span class="nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="nav__label">设置</span>
          </a>
        </nav>
        <div class="sidebar__foot">
          <a class="sidebar__link" href="/swagger-ui/" target="_blank" rel="noopener">Swagger UI ↗</a>
          <a class="sidebar__link" href="/static/" target="_blank" rel="noopener">演示页 ↗</a>
        </div>
      </aside>

      <!-- 遮罩（移动端侧边栏打开时） -->
      <div class="scrim" id="sidebar-scrim" hidden></div>

      <!-- 主区域，view 模块挂载点 -->
      <main class="main" id="app" aria-live="polite"></main>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-stack" id="toast-stack" aria-live="assertive" aria-atomic="false"></div>

    <!-- 对话框挂载点 -->
    <div class="dialog-portal" id="dialog-portal" hidden></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
