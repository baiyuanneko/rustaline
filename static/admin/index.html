<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>rustaline · 管理面板</title>
    <link rel="stylesheet" href="../vendor/mdui/mdui.css" />
    <link rel="stylesheet" href="./admin.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232196f3'/%3E%3Cpath d='M9 11h14M9 16h10M9 21h7' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <mdui-layout full-height class="admin-layout">
      <!-- 顶栏 -->
      <mdui-top-app-bar variant="small" scroll-behavior="elevate">
        <mdui-button-icon id="menu-toggle" aria-label="切换导航" data-i18n-aria="nav.toggle">
          <mdui-icon aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </mdui-icon>
        </mdui-button-icon>
        <mdui-top-app-bar-title>
          rustaline<span class="topbar__subtitle" data-i18n="app.subtitle">/ 管理面板</span>
        </mdui-top-app-bar-title>
        <div class="topbar__spacer"></div>
        <mdui-button-icon id="theme-toggle" aria-label="外观设置" data-i18n-aria="prefs.openLabel">
          <mdui-icon aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="fill:none">
              <path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.19-.95-.5-1.29-.31-.35-.5-.81-.5-1.21a2 2 0 0 1 2-2h2.35A3.65 3.65 0 0 0 21 10.85C20.97 6.46 16.87 3 12 3z" />
              <circle cx="7.6" cy="11.2" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="10.1" cy="7.6" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="14.4" cy="7.6" r="1.3" fill="currentColor" stroke="none" />
            </svg>
          </mdui-icon>
        </mdui-button-icon>
        <div class="topbar__user" id="topbar-user" hidden>
          <span class="topbar__username" id="topbar-username"></span>
          <mdui-button id="logout-btn" variant="text" data-i18n="auth.logout">登出</mdui-button>
        </div>
      </mdui-top-app-bar>

      <!-- 侧边导航 -->
      <mdui-navigation-drawer id="sidebar" placement="left" close-on-esc close-on-overlay-click>
        <div class="drawer__inner">
          <mdui-list class="nav">
            <mdui-list-item class="nav__item" data-route="dashboard" href="#/dashboard" rounded>
              <mdui-icon class="nav__ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20">
                  <path d="M4 13h6V4H4v9zm10 7h6V4h-6v16zM4 20h6v-4H4v4z" fill="currentColor" />
                </svg>
              </mdui-icon>
              <span data-i18n="nav.dashboard">仪表盘</span>
            </mdui-list-item>
            <mdui-list-item class="nav__item" data-route="comments" href="#/comments" rounded>
              <mdui-icon class="nav__ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" style="fill:none">
                  <path d="M21 11.5a8.38 8.38 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-4.5A8.38 8.38 0 0 1 3 11.5a8.5 8.5 0 0 1 17 0z" />
                </svg>
              </mdui-icon>
              <span data-i18n="nav.comments">评论管理</span>
              <mdui-badge id="pending-badge" slot="end-icon" variant="large" hidden></mdui-badge>
            </mdui-list-item>
            <mdui-list-item class="nav__item" data-route="import" href="#/import" rounded>
              <mdui-icon class="nav__ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="fill:none">
                  <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" />
                </svg>
              </mdui-icon>
              <span data-i18n="nav.import">Valine 导入</span>
            </mdui-list-item>
            <mdui-list-item class="nav__item" data-route="settings" href="#/settings" rounded>
              <mdui-icon class="nav__ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" style="fill:none">
                  <circle cx="12" cy="12" r="3" />
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83-2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0-1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
              </mdui-icon>
              <span data-i18n="nav.settings">设置</span>
            </mdui-list-item>
          </mdui-list>

          <div class="sidebar__foot">
            <a class="sidebar__link" href="/swagger-ui/" target="_blank" rel="noopener"><span data-i18n="nav.swagger">Swagger UI ↗</span></a>
            <a class="sidebar__link" href="/" target="_blank" rel="noopener"><span data-i18n="nav.demo">演示页 ↗</span></a>
          </div>
        </div>
      </mdui-navigation-drawer>

      <!-- 主区域，view 模块挂载点 -->
      <mdui-layout-main>
        <main class="main" id="app" aria-live="polite"></main>
      </mdui-layout-main>
    </mdui-layout>

    <script defer src="../vendor/mdui/mdui.global.js"></script>
    <script defer src="../theme.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
