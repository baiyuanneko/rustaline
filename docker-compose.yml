# bynrust26 编排：app + redis，SQLite 数据落卷
#
# 换用 PostgreSQL 的步骤：
#   1. 取消下方 postgres 服务的注释，app 的 depends_on 加上 postgres（带健康检查）
#   2. 修改 app.environment：
#        APP_DATABASE_URL: postgres://byn:byn@postgres:5432/bynrust26
#   3. 重新构建镜像并启用 postgres feature：
#        docker compose build --build-arg CARGO_FEATURES="--no-default-features --features postgres" app
#      （或把 build.args.CARGO_FEATURES 写进下方 app.build.args）
#   MySQL 同理（mysql://... + mysql feature）

services:
  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # postgres:
  #   image: postgres:17
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: byn
  #     POSTGRES_PASSWORD: byn
  #     POSTGRES_DB: bynrust26
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U byn -d bynrust26"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # 容器内用绝对路径，数据落在挂载卷里
      APP_DATABASE_URL: sqlite:///app/data/bynrust26.db?mode=rwc
      APP_REDIS_URL: redis://redis:6379
      # 生产环境必须通过 .env / secret 注入随机密钥（缺失即拒绝启动），生成：
      #   openssl rand -base64 48
      APP_JWT_SECRET: "${APP_JWT_SECRET:?must set APP_JWT_SECRET (generate with: openssl rand -base64 48)}"
      # 管理员账号（唯一用户）：仅在首次启动、admins 表为空时作为初始种子写入数据库；
      # 入库后这两个变量被忽略（改密码走管理面板），届时可从 .env 中移除
      APP_INITIAL_ADMIN_USERNAME: ${APP_INITIAL_ADMIN_USERNAME:-admin}
      APP_INITIAL_ADMIN_PASSWORD: ${APP_INITIAL_ADMIN_PASSWORD:-}
      APP_LOG_LEVEL: info
      # 反向代理部署（反代加入本 compose 网络）时开启：客户端 IP 改从 X-Forwarded-For 推导，
      # 限流桶 / 评论 ip 落库 / 验证码 IP 绑定随之按真实客户端生效。
      # 前提：app 不可被外部直连（本文件默认不发布端口，恰好满足）
      # APP_TRUST_XFF: "true"
    volumes:
      - sqlite-data:/app/data
    # 默认不绑定宿主机端口，app 仅在 compose 内网可达（redis 走内部服务名通信，本来就不绑定）。
    # 需要从宿主机/外部直接访问时取消注释；或让反向代理加入本 compose 网络。
    # ports:
    #   - "8080:8080"

volumes:
  sqlite-data:
  # pg-data:
