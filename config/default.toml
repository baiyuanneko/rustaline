# 默认配置。优先级（低 -> 高）：
#   config/default.toml < config/local.toml（gitignore，本机覆盖）< APP_* 环境变量

[server]
host = "0.0.0.0"
port = 8080

[database]
# SQLite 文件路径，启动时会自动创建父目录；?mode=rwc 表示不存在则创建
url = "sqlite://./data/bynrust26.db?mode=rwc"

[redis]
url = "redis://127.0.0.1:6379"

[jwt]
# 占位弱密钥：未通过 APP_JWT_SECRET 覆盖时启动校验会直接报错退出（H-1 加固）。
# 生成随机密钥：openssl rand -base64 48
secret = "change-me-in-production"
# access token 有效期（秒），默认 24h
ttl_secs = 86400
# 是否启用基于 Redis 的 JWT 黑名单（logout 吊销 token）。
# 启用时若连不上 Redis，应用启动直接报错退出
blacklist_enabled = true

[log]
# tracing env-filter 语法
level = "info"

[static]
# 静态文件目录，兜底挂载在根路径；相对路径基于应用启动时的工作目录
dir = "static"

[comment]
# true 时新评论 status=pending，需审核后才公开
moderation = false
# 评论内容最大长度
max_length = 10000
# 单 IP 每分钟最多提交数（内存滑动窗口限流）
rate_limit_per_minute = 5
# 未提供昵称时的默认值
default_nick = "Anonymous"
# 邮箱头像（gravatar 协议）镜像 CDN；置空字符串则完全禁用邮箱头像层
avatar_cdn = "https://gravatar.loli.net/avatar/"

# 管理员账号（唯一用户）没有默认值：APP_INITIAL_ADMIN_USERNAME / APP_INITIAL_ADMIN_PASSWORD
# （或嵌套写法 APP_INITIAL_ADMIN__USERNAME / APP_INITIAL_ADMIN__PASSWORD）
# 仅在首次启动、admins 表为空时作为种子写入数据库；入库后被忽略（改密码走管理面板）
