# 默认配置。优先级（低 -> 高）：
#   config/default.toml < config/local.toml（gitignore，本机覆盖）< APP_* 环境变量

[server]
host = "0.0.0.0"
port = 8080
# 反代部署时是否采信 X-Forwarded-For 推导真实客户端 IP（取最右侧条目）。
# 默认 false：一律使用连接对端 IP，XFF 被忽略。
# 仅当 app 不可被外部直连、仅经反代可达时才可置 true，否则客户端可伪造 XFF 绕过限流。
trust_xff = false

[database]
# SQLite 文件路径，启动时会自动创建父目录；?mode=rwc 表示不存在则创建
url = "sqlite://./data/bynrust26.db?mode=rwc"

[redis]
url = "redis://127.0.0.1:6379"

[jwt]
# 占位弱密钥：未通过 APP_JWT_SECRET 覆盖时启动校验会直接报错退出（H-1 加固）。
# 生成随机密钥：openssl rand -base64 48
secret = "change-me-in-production"
# access token 有效期（秒），默认 24h
ttl_secs = 86400
# 是否启用基于 Redis 的 JWT 黑名单（logout 吊销 token）。
# 启用时若连不上 Redis，应用启动直接报错退出
blacklist_enabled = true

[log]
# tracing env-filter 语法
level = "info"

[static]
# 静态文件目录，兜底挂载在根路径；相对路径基于应用启动时的工作目录
dir = "static"
# 演示首页开关：false 时访问 / 返回 307 跳转 /admin/（SDK 与管理面板不受影响）
introduction_index = true

[swagger]
# Swagger UI / OpenAPI 文档开关：false 时 /swagger-ui 与 /api-doc/openapi.json 不再挂载（404）
enabled = true

[comment]
# true 时新评论 status=pending，需审核后才公开
moderation = false
# 评论内容最大长度
max_length = 10000
# 单 IP 每分钟最多提交数（内存滑动窗口限流）
rate_limit_per_minute = 5
# 未提供昵称时的默认值
default_nick = "Anonymous"
# 邮箱头像（gravatar 协议）镜像 CDN；置空字符串则完全禁用邮箱头像层
avatar_cdn = "https://gravatar.loli.net/avatar/"
# 是否在公共评论响应中下发 UA 解析摘要（ua_summary，如 "Chrome 126 · Windows"），
# 供 SDK 在评论旁显示评论者浏览器/系统徽章。默认开启
display_commenter_user_agent = true

# 评论验证码：PoW 与图形码相互独立，两者都开启时为 AND（两道都要过）。默认都开启
[comment.captcha]
# 基于 SHA-256 hashcash 的工作量证明开关；置 false 可退回旧行为（仅限流 + 蜜罐 + 审核）
pow_enabled = true
# PoW 难度：哈希十六进制前导零位数（期望 16^n 次哈希，4 = 约 6.5 万次，桌面无感）
pow_difficulty = 4
# challenge 有效期（秒）
pow_ttl_secs = 600
# 图形验证码开关；置 false 可关闭
image_enabled = true
# 图形验证码有效期（秒）
image_ttl_secs = 300
# 单个图形码最大错误尝试次数，达到即作废
image_max_attempts = 3
# PoW challenge 是否绑定签发时客户端 IP（防代理池共享预解；切换网络需重新获取）
bind_ip = false
# HMAC 签名密钥；留空则从 jwt.secret 域分离派生。需要独立设置时用 openssl rand -base64 48
secret = ""

# 管理员账号（唯一用户）没有默认值：APP_INITIAL_ADMIN_USERNAME / APP_INITIAL_ADMIN_PASSWORD
# （或嵌套写法 APP_INITIAL_ADMIN__USERNAME / APP_INITIAL_ADMIN__PASSWORD）
# 仅在首次启动、admins 表为空时作为种子写入数据库；入库后被忽略（改密码走管理面板）
